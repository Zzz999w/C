<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>词语斩 · 注释/侧重分开测</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(165deg,#eef6ff 0%,#f8fcff 45%,#e9faf5 100%);
    min-height:100vh;color:#1f2937;
  }
  .app{max-width:520px;margin:0 auto;padding:18px 16px 40px;min-height:100vh;display:flex;flex-direction:column}

  /* 顶部 */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .brand{font-size:17px;font-weight:700;color:#0f766e;letter-spacing:.5px}
  .score{display:flex;gap:12px;font-size:14px;font-weight:600}
  .score .ok{color:#10b981}
  .score .no{color:#ef4444}
  .progress{height:7px;border-radius:99px;background:#e2ecf5;overflow:hidden;margin-bottom:8px}
  .bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#2dd4bf);transition:width .35s ease}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:#7b93aa;margin-bottom:16px}
  .meta .tip{font-weight:600}

  /* 卡片 */
  .card{
    background:#fff;border-radius:26px;padding:30px 22px;text-align:center;
    box-shadow:0 12px 34px rgba(20,80,140,.09),0 2px 6px rgba(20,80,140,.04);
    min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    margin-bottom:18px;border:1px solid #eef4f9;position:relative;
  }
  .card.pop{animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{0%{transform:scale(.94);opacity:.35}100%{transform:scale(1);opacity:1}}
  .card .badge{
    position:absolute;top:14px;left:16px;
    font-size:11px;font-weight:700;letter-spacing:1px;
    padding:4px 10px;border-radius:99px;
  }
  .badge.def{background:#e0f2fe;color:#0284c7}
  .badge.side{background:#fef3c7;color:#b45309}
  .word{font-weight:800;color:#0f172a;letter-spacing:2px;line-height:1.25}
  .sub{margin-top:14px;font-size:13px;color:#9fb2c4;letter-spacing:1px}

  /* 选项 */
  .options{flex:1}
  .opt{
    width:100%;display:flex;align-items:center;gap:12px;
    background:#fff;border:2px solid #e9eff6;border-radius:17px;
    padding:15px 16px;margin-bottom:11px;font-size:15.5px;line-height:1.5;
    color:#233246;text-align:left;cursor:pointer;font-family:inherit;
    transition:border-color .15s,background .15s,transform .1s,opacity .2s;
    box-shadow:0 2px 6px rgba(20,80,140,.04);
  }
  .opt:active{transform:scale(.985)}
  .opt .tag{
    flex:0 0 27px;height:27px;border-radius:9px;background:#f1f6fb;color:#5c7d9e;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s;
  }
  .opt.right{border-color:#34d399;background:#ecfdf5}
  .opt.right .tag{background:#34d399;color:#fff}
  .opt.wrong{border-color:#f87171;background:#fef2f2}
  .opt.wrong .tag{background:#f87171;color:#fff}
  .opt.dim{opacity:.45}
  .opt.lock{cursor:default}

  /* 底部按钮 */
  .footer{display:flex;gap:12px;margin-top:6px}
  .btn{
    flex:1;border:none;border-radius:15px;padding:14px;font-size:15px;font-weight:600;
    font-family:inherit;cursor:pointer;transition:transform .1s,filter .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#fff;color:#5c7d9e;border:2px solid #e6eef6}
  .btn.main{background:linear-gradient(90deg,#38bdf8,#2dd4bf);color:#fff;box-shadow:0 8px 20px rgba(45,212,191,.32)}

  /* 开始/结束面板 */
  .panel{
    background:#fff;border-radius:26px;padding:28px 22px;text-align:center;
    box-shadow:0 12px 34px rgba(20,80,140,.09);border:1px solid #eef4f9;
  }
  .panel h1{margin:0 0 6px;font-size:25px;color:#0f172a;letter-spacing:1px}
  .panel h1 span{color:#14b8a6}
  .panel p{margin:0 0 20px;font-size:13.5px;color:#8ba3b8;line-height:1.7}

  .row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
  .row label{font-size:13px;color:#5c7d9e;font-weight:600;letter-spacing:.5px}
  .row select{
    padding:9px 14px;border-radius:12px;border:2px solid #e9eff6;background:#fff;
    font-size:14px;color:#233246;font-family:inherit;font-weight:600;
    outline:none;cursor:pointer;max-width:100%;
  }
  .row select:focus{border-color:#2dd4bf}

  .chips{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
  .chip{
    padding:9px 18px;border-radius:12px;border:2px solid #e9eff6;background:#fff;
    color:#5c7d9e;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
    transition:all .15s;
  }
  .chip.on{border-color:#2dd4bf;background:#effcf9;color:#0f9b8a}
  .chip[data-mode="side"].on{border-color:#f59e0b;background:#fffbeb;color:#b45309}
  .chip[data-mode="mix"].on{border-color:#8b5cf6;background:#f5f3ff;color:#6d28d9}

  .result{font-size:52px;font-weight:800;color:#14b8a6;margin:6px 0 2px;letter-spacing:-1px}
  .result small{font-size:18px;color:#9fb2c4;font-weight:600}
  .stat{font-size:14px;color:#7b93aa;margin-bottom:8px}
  .subStat{font-size:12.5px;color:#9fb2c4;margin-bottom:22px}

  .empty{
    font-size:14px;color:#ef4444;background:#fef2f2;border-radius:12px;
    padding:12px;margin-bottom:16px;
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ 开始页 ============ -->
  <div id="startPage">
    <div class="panel" style="margin-top:32px">
      <h1>词语<span>斩</span></h1>
      <p>选择分组、题量和测试内容。<br>注释 = 释义辨析；侧重 = 词义侧重方向。</p>

      <div class="row">
        <label for="groupSelect">分组</label>
        <select id="groupSelect"></select>
      </div>

      <div class="row">
        <label>题量</label>
        <div class="chips" id="numRow">
          <button class="chip on" data-n="10">10</button>
          <button class="chip" data-n="20">20</button>
          <button class="chip" data-n="50">50</button>
          <button class="chip" data-n="0">全部</button>
        </div>
      </div>

      <div class="row">
        <label>测试内容</label>
        <div class="chips" id="modeRow">
          <button class="chip on" data-mode="def">注释</button>
          <button class="chip" data-mode="side">侧重</button>
          <button class="chip" data-mode="mix">混合</button>
        </div>
      </div>

      <div id="warnBox" class="empty" style="display:none"></div>

      <button class="btn main" id="startBtn" style="width:100%">开始背词</button>
    </div>
  </div>

  <!-- ============ 答题页 ============ -->
  <div id="quizPage" style="display:none;flex:1;flex-direction:column">
    <div class="topbar">
      <div class="brand">词语斩</div>
      <div class="score">
        <span class="ok">✓ <b id="okNum">0</b></span>
        <span class="no">✗ <b id="noNum">0</b></span>
      </div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="meta"><span id="counter">1 / 10</span><span class="tip" id="tip">请选择正确的释义</span></div>

    <div class="card pop" id="card">
      <div class="badge def" id="badge">注释</div>
      <div class="word" id="word">词语</div>
    </div>

    <div class="options" id="options"></div>

    <div class="footer">
      <button class="btn ghost" id="skipBtn">跳过</button>
      <button class="btn main" id="nextBtn" style="display:none">下一题</button>
    </div>
  </div>

  <!-- ============ 结束页 ============ -->
  <div id="endPage" style="display:none">
    <div class="panel" style="margin-top:32px">
      <p style="margin:0 0 4px;font-size:14px;color:#9fb2c4">本轮正确率</p>
      <div class="result" id="rate">0<small>%</small></div>
      <div class="stat" id="statLine">答对 0 题 · 答错 0 题</div>
      <div class="subStat" id="groupLine"></div>
      <button class="btn main" id="againBtn" style="width:100%">再来一轮</button>
      <button class="btn ghost" id="homeBtn" style="width:100%;margin-top:10px">返回首页</button>
    </div>
  </div>

</div>

/* =========================================================
   三、解析
   ========================================================= */
function parseRaw(raw){
  const list = [];
  raw.trim().split('\n').forEach((line, row) => {
    if (!line.trim()) return;
    const parts = line.split('|').map(s => s.trim());
    for (let i = 0; i + 1 < parts.length; i += 2){
      const w = parts[i], d = parts[i + 1];
      if (w && d) list.push({ word: w, def: d, row, col: i / 2 });
    }
  });
  const map = new Map();
  list.forEach(o => { if (!map.has(o.word)) map.set(o.word, o); });
  return [...map.values()];
}

function parseSides(raw){
  const map = {};
  let idx = 0;
  raw.trim().split('\n').forEach(line => {
    if (!line.trim()) return;
    const parts = line.split('|').map(s => s.trim());
    if (parts.length >= 2 && parts[0] && parts[1]){
      map[parts[0]] = { side: parts[1], srow: idx++, scol: 0 };
    }
  });
  return map;
}

const WORDS = parseRaw(RAW);
const SIDE_MAP = parseSides(SIDES);

/* 把侧重挂到词上 */
WORDS.forEach(w => {
  const s = SIDE_MAP[w.word];
  w.side = s ? s.side : '';
  w.srow = s ? s.srow : -1;
  w.scol = s ? s.scol : 0;
});

/* 统计 */
const HAS_SIDE = WORDS.filter(w => w.side);

/* =========================================================
   四、相似度
   ========================================================= */
const DF = {};
WORDS.forEach(o => {
  const set = new Set(
    (o.def + o.word).replace(/[，。、；：""''（）()《》【】\s\-—…·!！?？]/g, '').split('')
  );
  set.forEach(c => DF[c] = (DF[c] || 0) + 1);
});
SIDES.trim().split('\n').forEach(line => {
  const p = line.split('|');
  if (p.length < 2) return;
  const set = new Set(
    (p[0] + p[1]).replace(/[，。、；：""''（）()《》【】\s\-—…·!！?？]/g, '').split('')
  );
  set.forEach(c => DF[c] = (DF[c] || 0) + 1);
});

function weight(c){ return 1 / Math.sqrt(DF[c] || 1); }

function clean(s){
  return s.replace(/[，。、；：""''（）()《》【】\s\-—…·!！?？]/g, '');
}

/* 文本相似度 */
function simText(a, b){
  const A = new Set(clean(a).split(''));
  const B = new Set(clean(b).split(''));
  let inter = 0, uni = 0;
  const all = new Set([...A, ...B]);
  all.forEach(c => {
    const w = weight(c);
    if (A.has(c) && B.has(c)) inter += w;
    uni += w;
  });
  return uni ? inter / uni : 0;
}

/* 对象相似度（含位置） */
function simObj(a, b, type){
  const ta = type === 'def' ? (a.def + a.word) : (a.side + a.word);
  const tb = type === 'def' ? (b.def + b.word) : (b.side + b.word);
  return simText(ta, tb);
}

function posScore(a, b, type){
  if (type === 'def'){
    if (a.col !== b.col) return 0;
    return 1 / (1 + Math.abs(a.row - b.row) * 0.4);
  } else {
    if (a.scol !== b.scol) return 0;
    const d = Math.abs(a.srow - b.srow);
    return 1 / (1 + d * 0.4);
  }
}

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =========================================================
   五、选项生成
   ========================================================= */
function makeOptions(target, type){
  const getText = o => type === 'def' ? o.def : o.side;
  const targetText = getText(target);

  const poolAll = WORDS.filter(o =>
    o.word !== target.word && (type === 'def' || o.side)
  );

  const scored = poolAll.map(o => ({
    o,
    s: 0.5 * simObj(target, o, type) + 0.5 * posScore(target, o, type)
  })).sort((x, y) => y.s - x.s);

  let pool = scored.filter(x => simObj(target, x.o, type) < 0.82).slice(0, 14);
  if (pool.length < 3) pool = scored.slice(0, 14);

  const options = [{ text: targetText, correct: true }];
  const seen = new Set([targetText]);

  for (const item of shuffle(pool)){
    if (options.length >= 4) break;
    const t = getText(item.o);
    if (seen.has(t)) continue;
    seen.add(t);
    options.push({ text: t, correct: false });
  }
  if (options.length < 4){
    for (const item of scored){
      if (options.length >= 4) break;
      const t = getText(item.o);
      if (seen.has(t)) continue;
      seen.add(t);
      options.push({ text: t, correct: false });
    }
  }
  return shuffle(options);
}

/* =========================================================
   六、分组
   ========================================================= */
const GROUP_SIZE = 50;
const GROUPS = [];
for (let i = 0; i < WORDS.length; i += GROUP_SIZE){
  const end = Math.min(i + GROUP_SIZE, WORDS.length);
  GROUPS.push({
    name: `第 ${Math.floor(i / GROUP_SIZE) + 1} 组（${i + 1} ~ ${end} 词）`,
    words: WORDS.slice(i, end)
  });
}

const groupSelect = document.getElementById('groupSelect');
GROUPS.forEach((g, i) => {
  const opt = document.createElement('option');
  opt.value = String(i);
  opt.textContent = g.name;
  groupSelect.appendChild(opt);
});
const allOpt = document.createElement('option');
allOpt.value = '-1';
allOpt.textContent = `全部词库（共 ${WORDS.length} 词）`;
groupSelect.appendChild(allOpt);

/* =========================================================
   七、UI 逻辑
   ========================================================= */
const $ = id => document.getElementById(id);

let QUESTIONS = [];
let idx = 0, right = 0, wrong = 0;
let locked = false, answered = false;
let TOTAL = 10;
let MODE = 'def';
let currentGroupName = '';
let currentModeName = '';

/* --- 题量选择 --- */
$('numRow').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('#numRow .chip').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  TOTAL = parseInt(btn.dataset.n, 10);
  checkWarn();
});

/* --- 模式选择 --- */
$('modeRow').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('#modeRow .chip').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  MODE = btn.dataset.mode;
  checkWarn();
});

groupSelect.addEventListener('change', checkWarn);

/* --- 提示：侧重模式下某组无侧重数据 --- */
function checkWarn(){
  const box = $('warnBox');
  if (MODE === 'def'){ box.style.display = 'none'; return; }

  const groupIdx = parseInt(groupSelect.value, 10);
  let sideCount;
  if (groupIdx === -1) sideCount = HAS_SIDE.length;
  else sideCount = GROUPS[groupIdx].words.filter(w => w.side).length;

  if (MODE === 'side' && sideCount === 0){
    box.style.display = 'block';
    box.textContent = '当前分组没有侧重数据，请换一组或改用“注释/混合”模式。';
  } else if (MODE === 'mix' && sideCount === 0){
    box.style.display = 'block';
    box.textContent = '当前分组没有侧重数据，混合模式将全部按注释出题。';
  } else {
    box.style.display = 'none';
  }
}

/* --- 按钮 --- */
$('startBtn').onclick = () => startGame(TOTAL);
$('againBtn').onclick = () => startGame(TOTAL);
$('homeBtn').onclick = () => {
  $('endPage').style.display = 'none';
  $('startPage').style.display = 'block';
};
$('skipBtn').onclick = () => { if (!answered) nextQuestion(); };
$('nextBtn').onclick = () => nextQuestion();

/* --- 开始 --- */
function startGame(n){
  const groupIdx = parseInt(groupSelect.value, 10);
  let source, groupName;

  if (groupIdx === -1){
    source = WORDS;
    groupName = '全部词库';
  } else {
    source = GROUPS[groupIdx].words;
    groupName = GROUPS[groupIdx].name;
  }
  currentGroupName = groupName;
  currentModeName = MODE === 'def' ? '注释' : MODE === 'side' ? '侧重' : '混合';

  /* 先按模式筛选可出题词条 */
  let candidates;
  if (MODE === 'def'){
    candidates = source.map(w => ({ w, type: 'def' }));
  } else if (MODE === 'side'){
    candidates = source.filter(w => w.side).map(w => ({ w, type: 'side' }));
  } else {
    candidates = source.map(w => ({
      w,
      type: (w.side && Math.random() < 0.5) ? 'side' : 'def'
    }));
  }

  if (candidates.length === 0){
    $('warnBox').style.display = 'block';
    $('warnBox').textContent = '当前分组在“侧重”模式下没有可出题的词，请换组或改用注释/混合模式。';
    return;
  }

  const total = (n === 0) ? candidates.length : Math.min(n, candidates.length);
  const picked = shuffle(candidates).slice(0, total);

  QUESTIONS = picked.map(p => ({
    word: p.w.word,
    type: p.type,
    options: makeOptions(p.w, p.type)
  }));

  idx = 0; right = 0; wrong = 0;
  $('okNum').textContent = '0';
  $('noNum').textContent = '0';

  $('startPage').style.display = 'none';
  $('endPage').style.display = 'none';
  $('quizPage').style.display = 'flex';

  renderQuestion();
}

/* --- 渲染 --- */
function renderQuestion(){
  const q = QUESTIONS[idx];
  locked = false; answered = false;

  const card = $('card');
  card.classList.remove('pop');
  void card.offsetWidth;
  card.classList.add('pop');

  /* 徽标：注释 / 侧重 */
  const badge = $('badge');
  if (q.type === 'def'){
    badge.className = 'badge def';
    badge.textContent = '注释';
  } else {
    badge.className = 'badge side';
    badge.textContent = '侧重';
  }

  const wEl = $('word');
  wEl.textContent = q.word;
  const len = q.word.length;
  wEl.style.fontSize =
    len <= 2 ? '54px' :
    len <= 3 ? '46px' :
    len <= 4 ? '38px' :
    len <= 5 ? '32px' : '26px';

  $('counter').textContent = (idx + 1) + ' / ' + QUESTIONS.length;
  $('bar').style.width = (idx / QUESTIONS.length * 100) + '%';

  const tip = $('tip');
  if (q.type === 'def'){
    tip.textContent = '请选择正确的释义';
    tip.style.color = '#0284c7';
  } else {
    tip.textContent = '请选择最贴近的侧重描述';
    tip.style.color = '#b45309';
  }

  const box = $('options');
  box.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="tag">' + letters[i] + '</span><span class="txt"></span>';
    btn.querySelector('.txt').textContent = opt.text;
    btn.onclick = () => choose(btn, opt);
    box.appendChild(btn);
  });

  $('nextBtn').style.display = 'none';
  $('skipBtn').style.display = 'block';
}

/* --- 选择 --- */
function choose(btn, opt){
  if (locked) return;
  locked = true; answered = true;

  const all = document.querySelectorAll('.opt');
  all.forEach(b => b.classList.add('lock'));

  const q = QUESTIONS[idx];
  const correctText = q.options.find(o => o.correct).text;

  if (opt.correct){
    btn.classList.add('right');
    right++;
    $('okNum').textContent = right;
    $('tip').textContent = '✓ 答对了';
    $('tip').style.color = '#10b981';
  } else {
    btn.classList.add('wrong');
    wrong++;
    $('noNum').textContent = wrong;
    $('tip').textContent = '✗ 答错了';
    $('tip').style.color = '#ef4444';

    all.forEach(b => {
      if (b.querySelector('.txt').textContent === correctText){
        b.classList.add('right');
      } else if (b !== btn){
        b.classList.add('dim');
      }
    });
  }

  $('skipBtn').style.display = 'none';
  $('nextBtn').style.display = 'block';

  setTimeout(() => { if (answered) nextQuestion(); }, 1400);
}

/* --- 下一题 --- */
function nextQuestion(){
  idx++;
  if (idx >= QUESTIONS.length){
    finish();
  } else {
    renderQuestion();
  }
}

/* --- 结束 --- */
function finish(){
  $('bar').style.width = '100%';
  $('quizPage').style.display = 'none';
  $('endPage').style.display = 'block';

  const done = right + wrong;
  const rate = done ? Math.round(right / done * 100) : 0;

  $('rate').innerHTML = rate + '<small>%</small>';
  $('statLine').textContent =
    '答对 ' + right + ' 题 · 答错 ' + wrong + ' 题 · 共 ' + QUESTIONS.length + ' 题';
  $('groupLine').textContent =
    '范围：' + currentGroupName + ' ｜ 内容：' + currentModeName;
}
